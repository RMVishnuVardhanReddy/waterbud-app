name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK preinstalled; AGP auto-downloads any
      # missing platform/build-tools (licenses are pre-accepted on the image).

      - name: Build debug APK (Waterbud phone app)
        id: build
        working-directory: 01-water-reminder
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report build log to commit (so the author can read it)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '### Android CI — ${{ steps.build.outcome }}'
            echo ''
            echo '#### Compile errors'
            echo '```'
            grep -nE "^e: |^w: |: error:|error: |Unresolved reference|cannot access|None of the following|too many|conflicting|overload" /tmp/build.log 2>/dev/null | head -120 || echo '(no matches)'
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -n 40 /tmp/build.log 2>/dev/null || echo '(no build log)'
            echo '```'
          } > /tmp/body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: waterbud-debug-apk
          path: 01-water-reminder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
