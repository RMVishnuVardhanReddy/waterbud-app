name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unit tests + debug APK
        id: build
        working-directory: 01-water-reminder
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log

      - name: Report log to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### app job — ${{ steps.build.outcome }}"
            echo '#### Errors / test failures'
            echo '```'
            grep -nE "^e: |: error:|error: |Unresolved reference|FAILED|Tests? failed|expected:|AssertionError" /tmp/build.log 2>/dev/null | head -120 || echo '(none)'
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -n 30 /tmp/build.log 2>/dev/null
            echo '```'
          } > /tmp/body.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/body.md || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waterbud-debug-apk
          path: 01-water-reminder/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK (runs R8/shrinker — catches missing keep rules)
        id: rel
        working-directory: 01-water-reminder
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/rel.log

      - name: Report release log to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### release (R8) job — ${{ steps.rel.outcome }}"
            echo '```'
            grep -nE "^e: |: error:|error: |Unresolved|Missing class|R8|shrink|FAILED" /tmp/rel.log 2>/dev/null | head -100 || echo '(none)'
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -n 30 /tmp/rel.log 2>/dev/null
            echo '```'
          } > /tmp/rbody.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/rbody.md || true

  wear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Wear debug APK
        id: wearbuild
        working-directory: 01-water-reminder
        run: |
          set -o pipefail
          ./gradlew :wear:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/wear.log

      - name: Report wear log to commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### wear job — ${{ steps.wearbuild.outcome }}"
            echo '```'
            grep -nE "^e: |: error:|error: |Unresolved reference|FAILED|requires|minimum" /tmp/wear.log 2>/dev/null | head -80 || echo '(none)'
            echo '```'
            echo '#### Tail'
            echo '```'
            tail -n 25 /tmp/wear.log 2>/dev/null
            echo '```'
          } > /tmp/wbody.md
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -F body=@/tmp/wbody.md || true

      - name: Upload Wear APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: waterbud-wear-debug-apk
          path: 01-water-reminder/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
